<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homies - Uniform Flip Edition</title>
<style>
    body { margin:0; font-family:Arial, sans-serif; background:#aaa; padding:40px; text-align:center; }
    
    .grid { 
        display:grid; 
        grid-template-columns:repeat(auto-fit, 250px); 
        gap:40px; 
        justify-content:center; 
        perspective: 1200px; 
    }
    
    .card-container { 
        width: 250px; 
        height: 350px; 
        position: relative; 
        transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        transform-style: preserve-3d; 
        -webkit-transform-style: preserve-3d;
        cursor: pointer;
    }
    
    .card-container.active { 
        transform: rotateY(180deg) scale(1.1); 
        z-index: 1000; 
    }

    .card-front, .card-back {
        position: absolute; 
        width: 100%; 
        height: 100%; 
        backface-visibility: hidden; 
        -webkit-backface-visibility: hidden;
        border: 8px solid #d8dfd2; 
        border-radius: 15px; 
        box-sizing: border-box;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding: 15px; 
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .card-front { background: #a97f7f; z-index: 2; }

    .card-back { 
        background: #8e6b6b; 
        transform: rotateY(180deg); 
        z-index: 1; 
        display: flex;
        flex-direction: column;
    }

    .avatar { width: 100%; height: 210px; background: #d8dfd2; overflow: hidden; border-radius: 8px; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { margin-top: 15px; font-size: 24px; font-weight: bold; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
    
    /* Fixed: Added height fit-content and flex-grow 0 to stop stretching */
    .trait-tag { 
        background: #ff9999; 
        color: white; 
        padding: 8px 16px; 
        border-radius: 20px; 
        margin: 5px; 
        font-size: 14px; 
        font-weight: bold; 
        border: 2px solid rgba(255,255,255,0.3);
        height: fit-content;
        flex-grow: 0;
        display: inline-block;
    }
    
    .delete-btn { 
        position: absolute; top: -10px; right: -10px; 
        background: #fff; border: 3px solid #ff4444; border-radius: 50%; 
        width: 32px; height: 32px; color: #ff4444; 
        font-weight: bold; cursor: pointer; z-index: 100; 
    }
    
    .btn-ui { 
        margin: 10px auto; padding: 12px 24px; 
        background: #a97f7f; border: 4px solid #d8dfd2; 
        color: white; font-weight: bold; border-radius: 12px; 
        cursor: pointer; font-size: 18px;
    }
    
    #addPage { display:none; }
    input { padding: 10px; border-radius: 8px; border: none; width: 80%; max-width: 300px; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="homePage">
    <button class="btn-ui" onclick="showAddPage()">+ Add New Homie</button>
    <div class="grid" id="grid"></div>
</div>

<div id="addPage">
    <h1 style="color:white">Add a New Homie</h1>
    <input type="text" id="nameInput" placeholder="Enter Name"><br>
    <p style="color:white">Upload photo:</p>
    <input type="file" id="imgInput" accept="image/*"><br><br>
    <button class="btn-ui" onclick="saveHomie()">Save Homie</button>
    <button class="btn-ui" style="background:#666" onclick="goHome()">Cancel</button>
</div>

<script>
const exportedBackup = '[{"name":"hsj","img":"https://vinzinner.github.io/HOMMIES/images/WBZR1.jpg","traits":["菜","菜","菜"]},{"name":"zds","img":"https://vinzinner.github.io/HOMMIES/images/taawa.jpg","traits":["Absent","Absent","Absent"]},{"name":"zza","img":"https://vinzinner.github.io/HOMMIES/images/TowIg.jpg","traits":["fat ","fat","fat"]}]';

// Force load to clear any old mobile cache
let homies = JSON.parse(exportedBackup);
localStorage.setItem('homies_data', JSON.stringify(homies));

function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    homies.forEach((h, index) => {
        const container = document.createElement('div');
        container.className = 'card-container';
        container.id = `card-${index}`;
        
        container.onclick = function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.classList.contains('trait-tag')) return;
            this.classList.toggle('active');
        };

        container.innerHTML = `
            <button class="delete-btn" onclick="deleteHomie(${index})">X</button>
            <div class="card-front">
                <div class="avatar"><img src="${h.img}"></div>
                <div class="name">${h.name}</div>
                <p style="color:rgba(255,255,255,0.7); font-size:12px; margin-top:20px;">Tap to Flip</p>
            </div>
            <div class="card-back">
                <div class="name" style="margin-bottom:15px; border-bottom: 2px solid #d8dfd2; width: 100%; padding-bottom: 10px;">${h.name}</div>
                
                <div id="traits-${index}" style="display:flex; flex-wrap:wrap; justify-content:center; align-content: flex-start; flex: 1; overflow-y: auto;">
                    ${h.traits.map((t, tIdx) => `<span class="trait-tag" onclick="deleteTrait(${index}, ${tIdx})">${t}</span>`).join('')}
                </div>
                
                <button class="btn-ui" style="font-size:14px; padding: 8px 16px; margin-top:10px;" onclick="addTrait(${index})">+ Add Trait</button>
            </div>
        `;
        grid.appendChild(container);
    });
}

function addTrait(index) {
    const t = prompt("New trait:");
    if(t) {
        homies[index].traits.push(t);
        renderGrid();
        document.getElementById(`card-${index}`).classList.add('active');
    }
}

function deleteTrait(hIdx, tIdx) {
    homies[hIdx].traits.splice(tIdx, 1);
    renderGrid();
    document.getElementById(`card-${hIdx}`).classList.add('active');
}

function deleteHomie(index) {
    if(confirm("Delete this homie?")) {
        homies.splice(index, 1);
        renderGrid();
    }
}

function saveHomie() {
    const name = document.getElementById('nameInput').value;
    const file = document.getElementById('imgInput').files[0];
    if(!name) return;
    
    const finish = (img) => {
        homies.push({name, img, traits: []});
        goHome();
        renderGrid();
    };

    if(file) {
        const reader = new FileReader();
        reader.onload = (e) => finish(e.target.result);
        reader.readAsDataURL(file);
    } else {
        finish('https://vinzinner.github.io/HOMMIES/images/WBZR1.jpg');
    }
}

function showAddPage() { 
    document.getElementById('homePage').style.display='none'; 
    document.getElementById('addPage').style.display='block'; 
}

function goHome() { 
    document.getElementById('homePage').style.display='block'; 
    document.getElementById('addPage').style.display='none'; 
}

window.onload = renderGrid;
</script>
</body>
</html>
