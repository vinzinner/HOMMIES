<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homies Flip</title>
<style>
    body { margin:0; font-family:Arial; background:#aaa; padding:40px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, 250px); gap:40px; justify-content:center; perspective: 1000px; }
    
    /* The 3D Container */
    .card-container { width: 250px; height: 350px; position: relative; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
    
    /* When clicked/active, enlarge and flip */
    .card-container.active { transform: scale(1.2) rotateY(180deg); z-index: 100; }

    .card-front, .card-back {
        position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
        border: 8px solid #d8dfd2; border-radius: 10px; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; padding: 15px; box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
    }

    .card-front { background: #a97f7f; }
    .card-back { background: #8e6b6b; transform: rotateY(180deg); overflow-y: auto; }

    .avatar { width: 100%; height: 200px; background: #d8dfd2; overflow: hidden; border-radius: 5px; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { margin-top: 15px; font-size: 22px; font-weight: bold; color: white; }
    
    .trait-tag { background: #ff9999; color: white; padding: 5px 10px; border-radius: 5px; margin: 5px; font-size: 14px; font-weight: bold; }
    
    .delete-btn { position: absolute; top: -10px; right: -10px; background: white; border: 2px solid red; border-radius: 50%; width: 25px; height: 25px; color: red; font-weight: bold; cursor: pointer; z-index: 10; }
    
    .btn-ui { margin-bottom: 20px; padding: 10px 20px; background: #a97f7f; border: 4px solid #d8dfd2; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; display: block; margin: 10px auto; }
    
    #addPage { display:none; text-align:center; color:white; }
</style>
</head>
<body>

<div id="homePage">
    <button class="btn-ui" onclick="showAddPage()">+ Add New Homie</button>
    <div class="grid" id="grid"></div>
</div>

<div id="addPage">
    <h1>Add a Homie</h1>
    <input type="text" id="nameInput" placeholder="Name"><br><br>
    <input type="file" id="imgInput" accept="image/*"><br><br>
    <button class="btn-ui" onclick="saveHomie()">Save</button>
    <button class="btn-ui" onclick="goHome()">Cancel</button>
</div>

<script>
const exportedBackup = '[{"name":"hsj","img":"https://vinzinner.github.io/HOMMIES/images/WBZR1.jpg","traits":["菜","菜","菜"]},{"name":"zds","img":"https://vinzinner.github.io/HOMMIES/images/taawa.jpg","traits":["Absent","Absent","Absent"]},{"name":"zza","img":"https://vinzinner.github.io/HOMMIES/images/TowIg.jpg","traits":["fat ","fat","fat"]}]';

let homies = JSON.parse(localStorage.getItem('homies_data'));
if (!homies || homies.length === 0) {
    homies = JSON.parse(exportedBackup);
}

function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    homies.forEach((h, index) => {
        const container = document.createElement('div');
        container.className = 'card-container';
        container.id = `card-${index}`;
        container.onclick = (e) => {
            if(e.target.tagName !== 'BUTTON') container.classList.toggle('active');
        };

        container.innerHTML = `
            <button class="delete-btn" onclick="deleteHomie(${index})">X</button>
            <div class="card-front">
                <div class="avatar"><img src="${h.img}"></div>
                <div class="name">${h.name}</div>
                <p style="color:rgba(255,255,255,0.6); font-size:12px;">Click to see traits</p>
            </div>
            <div class="card-back">
                <div class="name" style="margin-bottom:10px;">${h.name}'s Traits</div>
                <div id="traits-${index}" style="display:flex; flex-wrap:wrap; justify-content:center;">
                    ${h.traits.map((t, tIdx) => `<span class="trait-tag" onclick="deleteTrait(${index}, ${tIdx})">${t}</span>`).join('')}
                </div>
                <button class="btn-ui" style="font-size:14px;" onclick="addTrait(${index})">+ Add</button>
            </div>
        `;
        grid.appendChild(container);
    });
    localStorage.setItem('homies_data', JSON.stringify(homies));
}

function addTrait(index) {
    const t = prompt("New Trait:");
    if(t) {
        homies[index].traits.push(t);
        renderGrid();
        document.getElementById(`card-${index}`).classList.add('active'); // Keep it flipped
    }
}

function deleteTrait(hIdx, tIdx) {
    homies[hIdx].traits.splice(tIdx, 1);
    renderGrid();
    document.getElementById(`card-${hIdx}`).classList.add('active');
}

function deleteHomie(index) {
    if(confirm("Delete?")) {
        homies.splice(index, 1);
        renderGrid();
    }
}

function saveHomie() {
    const name = document.getElementById('nameInput').value;
    const file = document.getElementById('imgInput').files[0];
    if(!name) return;
    
    const finish = (img) => {
        homies.push({name, img, traits: []});
        goHome();
        renderGrid();
    };

    if(file) {
        const reader = new FileReader();
        reader.onload = (e) => finish(e.target.result);
        reader.readAsDataURL(file);
    } else {
        finish('images/WBZR1.jpg');
    }
}

function showAddPage() { document.getElementById('homePage').style.display='none'; document.getElementById('addPage').style.display='block'; }
function goHome() { document.getElementById('homePage').style.display='block'; document.getElementById('addPage').style.display='none'; }

window.onload = renderGrid;
</script>
</body>
</html>
