<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homies Offline</title>
<style>
body {margin:0;font-family:Arial;background:#aaa;padding:40px;text-align:center;}
.grid {display:grid;grid-template-columns:repeat(auto-fit, 250px);gap:40px;justify-content:center;}
.card {background:#a97f7f;border:8px solid #d8dfd2;border-radius:10px;padding:20px;box-shadow:4px 4px 10px rgba(0,0,0,0.2);cursor:pointer;transition: transform 0.1s;}
.card:hover {transform: scale(1.02);}
.avatar {width:100%;height:220px;background:#d8dfd2;overflow:hidden;display:flex;justify-content:center;align-items:center;}
.avatar img {width:100%;height:100%;object-fit:cover;}
.name {margin-top:18px;font-size:24px;font-weight:bold;color:white;}
button {margin-bottom:20px;padding:16px 28px;font-size:20px;cursor:pointer;background:#a97f7f;border:8px solid #d8dfd2;border-radius:10px;color:white;font-weight:bold;box-shadow:4px 4px 10px rgba(0,0,0,0.2);}
.trait-card {padding:15px; border-radius:10px; border:4px solid #d8dfd2; color:white; font-weight:bold; font-size:18px;}
#addPage, #profilePage {display:none;}
</style>
</head>
<body>

<div id="homePage">
    <button onclick="showAddPage()">+ Add a New Homie</button>
    <div class="grid" id="grid"></div>
</div>

<div id="profilePage" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#aaa; padding:40px; box-sizing:border-box; z-index:1000; overflow:auto;">
    <h1 id="profileName" style="color:white; font-size:48px;"></h1>
    <div id='traits' style='display:flex;flex-wrap:wrap;gap:20px;justify-content:center;'></div><br>
    <button onclick='addTrait()'>+ Add Trait</button>
    <button onclick="goHome()">Back</button>
</div>

<div id="addPage">
    <h1>Add a Homie</h1>
    <input type="text" id="nameInput" placeholder="Homie Name" style="padding:10px; font-size:18px;"><br><br>
    <input type="file" id="imgInput" accept="image/*"><br><br>
    <p>Or choose a default:</p>
    <div id='defaultPics' style='display:flex;justify-content:center;gap:15px;'>
        <img src='images/WBZR1.jpg' onclick='selectDefault(this.src)' style='width:80px;height:80px;cursor:pointer;border:4px solid #d8dfd2;border-radius:10px;'>
        <img src='images/taawa.jpg' onclick='selectDefault(this.src)' style='width:80px;height:80px;cursor:pointer;border:4px solid #d8dfd2;border-radius:10px;'>
        <img src='images/TowIg.jpg' onclick='selectDefault(this.src)' style='width:80px;height:80px;cursor:pointer;border:4px solid #d8dfd2;border-radius:10px;'>
    </div><br>
    <button onclick="saveHomie()">Save</button>
    <button onclick="goHome()">Back</button>
</div>

<script>
    let homies = JSON.parse(localStorage.getItem('homies_data')) || [];
    let selectedDefault = '';
    let currentProfileIndex = null;

    // --- Core Logic ---

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        homies.forEach((h, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openProfile(index);
            card.innerHTML = `<div class='avatar'><img src='${h.img}'></div><div class='name'>${h.name}</div>`;
            grid.appendChild(card);
        });
        localStorage.setItem('homies_data', JSON.stringify(homies));
    }

    function saveHomie() {
        const name = document.getElementById('nameInput').value;
        const file = document.getElementById('imgInput').files[0];
        
        if (!name) return alert('Please enter a name');

        const processData = (imgSrc) => {
            homies.push({ name: name, img: imgSrc, traits: [] });
            renderGrid();
            goHome();
            // Reset inputs
            document.getElementById('nameInput').value = '';
            document.getElementById('imgInput').value = '';
            selectedDefault = '';
        };

        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => processData(e.target.result);
            reader.readAsDataURL(file);
        } else if (selectedDefault) {
            processData(selectedDefault);
        } else {
            alert('Please select or upload an image');
        }
    }

    function openProfile(index) {
        currentProfileIndex = index;
        const h = homies[index];
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('profilePage').style.display = 'block';
        document.getElementById('profileName').innerText = h.name;
        displayTraits();
    }

    function addTrait() {
        const word = prompt('What is this homie like?');
        if (!word) return;
        
        homies[currentProfileIndex].traits.push(word);
        displayTraits();
        localStorage.setItem('homies_data', JSON.stringify(homies));
    }

    function displayTraits() {
        const container = document.getElementById('traits');
        container.innerHTML = '';
        const colors = ['#ff9999','#99ccff','#99ff99','#ffcc99','#cc99ff'];
        const h = homies[currentProfileIndex];
        
        h.traits.forEach(t => {
            const div = document.createElement('div');
            div.className = 'trait-card';
            div.style.background = colors[Math.floor(Math.random() * colors.length)];
            div.innerText = t;
            container.appendChild(div);
        });
    }

    // --- Navigation ---

    function showAddPage() {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('addPage').style.display = 'block';
    }

    function goHome() {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('addPage').style.display = 'none';
        document.getElementById('profilePage').style.display = 'none';
    }

    function selectDefault(src) {
        selectedDefault = src;
        alert("Avatar selected!");
    }

    // Initial Load
    window.onload = renderGrid;
</script>

</body>
</html>
