<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homies - 3D Flip Edition</title>
<style>
    body { margin:0; font-family:Arial, sans-serif; background:#aaa; padding:40px; text-align:center; }
    
    .grid { 
        display:grid; 
        grid-template-columns:repeat(auto-fit, 250px); 
        gap:40px; 
        justify-content:center; 
        /* Perspective on the parent allows the 3D effect to happen */
        perspective: 1200px; 
    }
    
    /* The 3D Container */
    .card-container { 
        width: 250px; 
        height: 350px; 
        position: relative; 
        /* Smooth, bouncy animation */
        transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        transform-style: preserve-3d; 
        -webkit-transform-style: preserve-3d;
        cursor: pointer;
    }
    
    /* The Flip and Enlarge State */
    .card-container.active { 
        transform: rotateY(180deg) scale(1.1); 
        z-index: 1000; 
    }

    /* Common styles for Front and Back */
    .card-front, .card-back {
        position: absolute; 
        width: 100%; 
        height: 100%; 
        /* Hide the other side during the flip */
        backface-visibility: hidden; 
        -webkit-backface-visibility: hidden;
        border: 8px solid #d8dfd2; 
        border-radius: 15px; 
        box-sizing: border-box;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding: 15px; 
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .card-front { 
        background: #a97f7f; 
        z-index: 2; 
    }

    .card-back { 
        background: #8e6b6b; 
        /* The back starts already flipped 180 degrees */
        transform: rotateY(180deg); 
        z-index: 1; 
        overflow-y: auto;
    }

    .avatar { width: 100%; height: 210px; background: #d8dfd2; overflow: hidden; border-radius: 8px; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { margin-top: 15px; font-size: 24px; font-weight: bold; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
    
    .trait-tag { 
        background: #ff9999; 
        color: white; 
        padding: 6px 12px; 
        border-radius: 20px; 
        margin: 5px; 
        font-size: 14px; 
        font-weight: bold; 
        border: 2px solid rgba(255,255,255,0.3);
    }
    
    .delete-btn { 
        position: absolute; top: -10px; right: -10px; 
        background: #fff; border: 3px solid #ff4444; border-radius: 50%; 
        width: 32px; height: 32px; color: #ff4444; 
        font-weight: bold; cursor: pointer; z-index: 100; 
    }
    
    .btn-ui { 
        margin: 10px auto; padding: 12px 24px; 
        background: #a97f7f; border: 4px solid #d8dfd2; 
        color: white; font-weight: bold; border-radius: 12px; 
        cursor: pointer; font-size: 18px;
    }
    
    #addPage { display:none; }
    #addPage h1 { color: white; }
    input { padding: 10px; border-radius: 8px; border: none; width: 80%; max-width: 300px; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="homePage">
    <button class="btn-ui" onclick="showAddPage()">+ Add New Homie</button>
    <div class="grid" id="grid"></div>
</div>

<div id="addPage">
    <h1>Add a New Homie</h1>
    <input type="text" id="nameInput" placeholder="Enter Name"><br>
    <p style="color:white">Upload photo:</p>
    <input type="file" id="imgInput" accept="image/*"><br><br>
    <button class="btn-ui" onclick="saveHomie()">Save Homie</button>
    <button class="btn-ui" style="background:#666" onclick="goHome()">Cancel</button>
</div>
